[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "echotrace"
dynamic = ["version"]
description = "Offline, evidence-linked memory for physical work"
requires-python = ">=3.9"
dependencies = ["fastapi==0.128.8", "uvicorn==0.39.0", "websockets==15.0.1", "numpy>=1.26,<3"]

[project.optional-dependencies]
ai = ["onnxruntime>=1.20,<2", "sherpa-onnx>=1.12,<2", "tokenizers>=0.21,<1", "jieba==0.42.1"]

[project.scripts]
echotrace = "echotrace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "echotrace.__version__"}

[tool.setuptools.package-data]
echotrace = ["web/*"]

